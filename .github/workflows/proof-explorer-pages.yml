name: Proof Explorer Pages

on:
  push:
    branches: [main]
    paths:
      - "web/proof-explorer/**"
      - ".github/workflows/proof-explorer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: proof-explorer-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/proof-explorer
      - name: Deploy Proof Explorer
        id: deployment
        uses: actions/deploy-pages@v4

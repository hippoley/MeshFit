name: MeshFit CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - run: cargo run -p meshfit -- discover
      - run: cargo run -p meshfit -- runtimes
      - run: cargo run -p meshfit -- inspect-model examples/model-artifact-demo.bin demo gguf q4_k_m test
      - run: cargo run -p meshfit -- snapshot examples/discovery-node-a.yaml examples/discovery-node-b.yaml examples/probe-a-b.yaml
      - run: cargo run -p meshfit -- plan examples/v0.1-placement.yaml
      - run: cargo run -p meshfit -- predict examples/v0.2-evidence.yaml examples/v0.2-query.yaml
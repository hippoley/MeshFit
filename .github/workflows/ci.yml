name: MeshFit CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: meshfit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - run: cargo run -p meshfit -- discover
      - run: MESHFIT_NODE_ID=node-ci cargo run -p meshfit -- discover > /tmp/meshfit-discover-node-id.yaml
      - run: grep -q 'node-ci' /tmp/meshfit-discover-node-id.yaml
      - run: cargo run -p meshfit -- runtimes
      - run: cargo run -p meshfit -- inspect-model examples/model-artifact-demo.bin demo gguf q4_k_m test
      - run: cargo run -p meshfit -- inspect-model examples/model-artifact-demo.bin qwen-72b-class-q4 gguf q4_k_m test > /tmp/meshfit-model-identity.yaml
      - run: cargo run -p meshfit -- snapshot examples/discovery-node-a.yaml examples/discovery-node-b.yaml examples/probe-a-b.yaml > /tmp/meshfit-snapshot.yaml
      - run: cargo run -p meshfit -- plan-snapshot /tmp/meshfit-snapshot.yaml examples/placement-target.yaml
      - run: cargo run -p meshfit -- snapshot-manifest examples/snapshot-manifest.yaml > /tmp/meshfit-snapshot-manifest.yaml
      - run: cargo run -p meshfit -- plan-snapshot /tmp/meshfit-snapshot-manifest.yaml examples/placement-target.yaml
      - run: cargo run -p meshfit -- compile examples/compile-vllm.yaml > /tmp/meshfit-executable.yaml
      - run: cargo run -p meshfit -- compile-snapshot /tmp/meshfit-snapshot-manifest.yaml examples/placement-target.yaml node-b:gpu0:vllm:SingleHost Qwen/Qwen3-32B > /tmp/meshfit-executable-from-snapshot.yaml
      - run: cargo run -p meshfit -- compile-snapshot /tmp/meshfit-snapshot-manifest.yaml examples/placement-target.yaml node-b:gpu0:vllm:SingleHost Qwen/Qwen3-32B --listen-port 18182 > /tmp/meshfit-executable-custom-port.yaml
      - run: 'grep -q "port: 18182" /tmp/meshfit-executable-custom-port.yaml'
      - run: cargo run -p meshfit -- plan examples/v0.1-placement.yaml
      - run: cargo run -p meshfit -- predict examples/v0.2-evidence.yaml examples/v0.2-query.yaml
      - run: cargo run -p meshfit -- evidence-from-benchmark examples/benchmark-bundle.yaml > /tmp/meshfit-benchmark-evidence.yaml
      - run: cargo run -p meshfit -- calibrate-memory examples/calibration-plan.yaml examples/benchmark-bundle.yaml > /tmp/meshfit-memory-calibration.yaml
      - run: "grep -q 'direction: under_prediction' /tmp/meshfit-memory-calibration.yaml"
      - run: "grep -q 'conservative_observed_to_predicted_ratio:' /tmp/meshfit-memory-calibration.yaml"
      - run: cargo run -p meshfit -- benchmark-candidates /tmp/meshfit-snapshot-manifest.yaml examples/placement-target.yaml node-b:gpu0:vllm:SingleHost > /tmp/meshfit-benchmark-candidates.yaml
      - run: cargo run -p meshfit -- benchmark-kit /tmp/meshfit-snapshot-manifest.yaml examples/placement-target.yaml node-b:gpu0:vllm:SingleHost Qwen/Qwen3-32B /tmp/meshfit-model-identity.yaml > /tmp/meshfit-benchmark-kit.yaml
      - run: "! cargo run -p meshfit -- benchmark-kit /tmp/meshfit-snapshot-manifest.yaml examples/placement-target.yaml node-b:gpu0:vllm:SingleHost Qwen/Qwen3-32B /tmp/meshfit-model-identity.yaml --listen-port 0"
      - run: cargo run -p meshfit -- benchmark-kit /tmp/meshfit-snapshot-manifest.yaml examples/placement-target.yaml node-b:gpu0:vllm:SingleHost Qwen/Qwen3-32B /tmp/meshfit-model-identity.yaml --listen-port 18181 --write-dir /tmp/meshfit-benchmark-001-materialized
      - run: test -f /tmp/meshfit-benchmark-001-materialized/kit.yaml
      - run: 'grep -q "listen_port: 18181" /tmp/meshfit-benchmark-001-materialized/kit.yaml'
      - run: grep -q 'Listen port.*18181' /tmp/meshfit-benchmark-001-materialized/RUNBOOK.md
      - run: test -f /tmp/meshfit-benchmark-001-materialized/comparison.yaml
      - run: test -f /tmp/meshfit-benchmark-001-materialized/RUNBOOK.md
      - run: grep -q '## Real-host execution' /tmp/meshfit-benchmark-001-materialized/RUNBOOK.md
      - run: grep -q 'export MESHFIT_NODE_ID=node-b' /tmp/meshfit-benchmark-001-materialized/RUNBOOK.md
      - run: grep -q 'MESHFIT_MODEL_PATH' /tmp/meshfit-benchmark-001-materialized/RUNBOOK.md
      - run: grep -q 'benchmark-host-check . --current-host --require-ready' /tmp/meshfit-benchmark-001-materialized/RUNBOOK.md
      - run: grep -q 'benchmark-run-host . --current-host --resume --dry-run' /tmp/meshfit-benchmark-001-materialized/RUNBOOK.md
      - run: grep -q 'benchmark-run-host . --current-host --resume' /tmp/meshfit-benchmark-001-materialized/RUNBOOK.md
      - run: grep -q 'benchmark-finalize . --markdown --require-publishable' /tmp/meshfit-benchmark-001-materialized/RUNBOOK.md
      - run: grep -q '## Recovery and debugging' /tmp/meshfit-benchmark-001-materialized/RUNBOOK.md
      - run: test -f /tmp/meshfit-benchmark-001-materialized/inputs/snapshot.yaml
      - run: test -f /tmp/meshfit-benchmark-001-materialized/inputs/target.yaml
      - run: test -f /tmp/meshfit-benchmark-001-materialized/inputs/model-identity.yaml
      - run: test -d /tmp/meshfit-benchmark-001-materialized/results/meshfit
      - run: test -d /tmp/meshfit-benchmark-001-materialized/artifacts/meshfit
      - run: cargo run -p meshfit -- benchmark-worklist /tmp/meshfit-benchmark-001-materialized --host node-b > /tmp/meshfit-benchmark-worklist.yaml
      - run: grep -q 'node-b' /tmp/meshfit-benchmark-worklist.yaml
      - run: grep -q 'pending' /tmp/meshfit-benchmark-worklist.yaml
      - run: grep -q -- '--host node-b' /tmp/meshfit-benchmark-worklist.yaml
      - run: MESHFIT_NODE_ID=node-b cargo run -p meshfit -- benchmark-worklist /tmp/meshfit-benchmark-001-materialized --current-host --pending-only > /tmp/meshfit-benchmark-current-host.yaml
      - run: grep -q 'node-b' /tmp/meshfit-benchmark-current-host.yaml
      - run: "! cargo run -p meshfit -- benchmark-worklist /tmp/meshfit-benchmark-001-materialized --host node-z"
      - run: cargo run -p meshfit -- benchmark-preflight /tmp/meshfit-benchmark-001-materialized meshfit --host node-b --model-path examples/model-artifact-demo.bin > /tmp/meshfit-model-override-preflight.yaml
      - run: grep -q 'local_override_verified' /tmp/meshfit-model-override-preflight.yaml
      - run: grep -q 'model_artifact_verified' /tmp/meshfit-model-override-preflight.yaml
      - run: 'grep -q "listen_port: 18181" /tmp/meshfit-model-override-preflight.yaml'
      - run: 'grep -q "hardware_profile_match: false" /tmp/meshfit-model-override-preflight.yaml'
      - run: grep -q 'accelerator count mismatch\|hardware architecture mismatch\|hardware operating-system mismatch\|snapshot has no hardware identity' /tmp/meshfit-model-override-preflight.yaml
      - run: |
          python3 -m http.server 18181 >/tmp/meshfit-port-18181.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 1
          cargo run -p meshfit -- benchmark-preflight /tmp/meshfit-benchmark-001-materialized meshfit --host node-b --model-path examples/model-artifact-demo.bin > /tmp/meshfit-port-busy-preflight.yaml
          grep -q 'listen_port_available: false' /tmp/meshfit-port-busy-preflight.yaml
          grep -q 'not currently available' /tmp/meshfit-port-busy-preflight.yaml
      - run: printf 'different-model' > /tmp/meshfit-wrong-model.bin
      - run: cargo run -p meshfit -- benchmark-preflight /tmp/meshfit-benchmark-001-materialized meshfit --host node-b --model-path /tmp/meshfit-wrong-model.bin > /tmp/meshfit-model-mismatch-preflight.yaml
      - run: grep -q 'local_override_hash_mismatch' /tmp/meshfit-model-mismatch-preflight.yaml
      - run: cargo run -p meshfit -- benchmark-run-one /tmp/meshfit-benchmark-001-materialized meshfit 1 --host node-b --model-path examples/model-artifact-demo.bin --dry-run > /tmp/meshfit-benchmark-run-one.yaml
      - run: grep -q 'candidate' /tmp/meshfit-benchmark-run-one.yaml
      - run: grep -q 'run_number' /tmp/meshfit-benchmark-run-one.yaml
      - run: grep -q 'model_artifact_verified' /tmp/meshfit-benchmark-run-one.yaml
      - run: 'grep -q "listen_port: 18181" /tmp/meshfit-benchmark-run-one.yaml'
      - run: mkdir -p /tmp/meshfit-benchmark-001-materialized/artifacts/meshfit
      - run: cargo run -p meshfit -- compile-snapshot /tmp/meshfit-benchmark-001-materialized/inputs/snapshot.yaml /tmp/meshfit-benchmark-001-materialized/inputs/target.yaml node-b:gpu0:vllm:SingleHost examples/model-artifact-demo.bin --listen-port 18182 > /tmp/meshfit-benchmark-001-materialized/artifacts/meshfit/executable.yaml
      - run: cargo run -p meshfit -- benchmark-run-one /tmp/meshfit-benchmark-001-materialized meshfit 1 --host node-b --model-path examples/model-artifact-demo.bin --dry-run > /tmp/meshfit-benchmark-run-one-stale-port.yaml
      - run: 'grep -q "compile_required: true" /tmp/meshfit-benchmark-run-one-stale-port.yaml'
      - run: "! cargo run -p meshfit -- benchmark-run-one /tmp/meshfit-benchmark-001-materialized meshfit 0 --host node-b --dry-run"
      - run: '! cargo run -p meshfit -- benchmark-run-one /tmp/meshfit-benchmark-001-materialized meshfit 1 --host node-b'
      - run: cargo run -p meshfit -- benchmark-run-candidate /tmp/meshfit-benchmark-001-materialized meshfit --host node-b --model-path examples/model-artifact-demo.bin --dry-run > /tmp/meshfit-benchmark-run-candidate.yaml
      - run: 'grep -q "candidate: meshfit" /tmp/meshfit-benchmark-run-candidate.yaml'
      - run: 'grep -q "preflight_ready: false" /tmp/meshfit-benchmark-run-candidate.yaml'
      - run: 'grep -q "pending_runs:" /tmp/meshfit-benchmark-run-candidate.yaml'
      - run: grep -q 'model_artifact_verified' /tmp/meshfit-benchmark-run-candidate.yaml
      - run: 'grep -q "listen_port: 18181" /tmp/meshfit-benchmark-run-candidate.yaml'
      - run: cargo run -p meshfit -- benchmark-run-host /tmp/meshfit-benchmark-001-materialized --host node-b --model-path examples/model-artifact-demo.bin --dry-run > /tmp/meshfit-benchmark-run-host.yaml
      - run: grep -q 'host' /tmp/meshfit-benchmark-run-host.yaml
      - run: grep -q 'model_artifact_verified' /tmp/meshfit-benchmark-run-host.yaml
      - run: 'grep -q "listen_port: 18181" /tmp/meshfit-benchmark-run-host.yaml'
      - run: cargo run -p meshfit -- benchmark-host-check /tmp/meshfit-benchmark-001-materialized --host node-b --model-path examples/model-artifact-demo.bin > /tmp/meshfit-benchmark-host-check.yaml
      - run: 'grep -q "host: node-b" /tmp/meshfit-benchmark-host-check.yaml'
      - run: 'grep -q "ready: false" /tmp/meshfit-benchmark-host-check.yaml'
      - run: grep -q 'local_hardware:' /tmp/meshfit-benchmark-host-check.yaml
      - run: 'grep -q "hardware_profile_match: false" /tmp/meshfit-benchmark-host-check.yaml'
      - run: grep -q 'preflight_warnings:' /tmp/meshfit-benchmark-host-check.yaml
      - run: '! cargo run -p meshfit -- benchmark-host-check /tmp/meshfit-benchmark-001-materialized --host node-b --model-path examples/model-artifact-demo.bin --require-ready'
      - run: MESHFIT_MODEL_PATH=examples/model-artifact-demo.bin cargo run -p meshfit -- benchmark-preflight /tmp/meshfit-benchmark-001-materialized meshfit --host node-b > /tmp/meshfit-model-env-preflight.yaml
      - run: grep -q 'local_override_verified' /tmp/meshfit-model-env-preflight.yaml
      - run: MESHFIT_MODEL_PATH=examples/model-artifact-demo.bin cargo run -p meshfit -- benchmark-run-candidate /tmp/meshfit-benchmark-001-materialized meshfit --host node-b --dry-run > /tmp/meshfit-model-env-candidate.yaml
      - run: grep -q 'model_artifact_verified' /tmp/meshfit-model-env-candidate.yaml
      - run: MESHFIT_MODEL_PATH=examples/model-artifact-demo.bin cargo run -p meshfit -- benchmark-run-host /tmp/meshfit-benchmark-001-materialized --host node-b --dry-run > /tmp/meshfit-model-env-host.yaml
      - run: grep -q 'model_artifact_verified' /tmp/meshfit-model-env-host.yaml
      - run: MESHFIT_NODE_ID=node-b cargo run -p meshfit -- benchmark-run-host /tmp/meshfit-benchmark-001-materialized --current-host --model-path examples/model-artifact-demo.bin --dry-run > /tmp/meshfit-benchmark-run-current-host.yaml
      - run: grep -q 'node-b' /tmp/meshfit-benchmark-run-current-host.yaml
      - run: "! cargo run -p meshfit -- benchmark-run-host /tmp/meshfit-benchmark-001-materialized --host node-z --dry-run"
      - run: "! cargo run -p meshfit -- benchmark-run-host /tmp/meshfit-benchmark-001-materialized --host node-b --resume --overwrite"
      - run: '! cargo run -p meshfit -- benchmark-run-host /tmp/meshfit-benchmark-001-materialized --host node-b --model-path examples/model-artifact-demo.bin'
      - run: '! cargo run -p meshfit -- benchmark-run-candidate /tmp/meshfit-benchmark-001-materialized meshfit --host node-b'
      - run: '! cargo run -p meshfit -- benchmark-run-candidate /tmp/meshfit-benchmark-001-materialized meshfit --host node-b --resume --overwrite'
      - run: cargo run -p meshfit -- benchmark-status /tmp/meshfit-benchmark-001-materialized > /tmp/meshfit-benchmark-status.yaml
      - run: cargo run -p meshfit -- benchmark-preflight /tmp/meshfit-benchmark-001-materialized meshfit --host node-b > /tmp/meshfit-benchmark-preflight.yaml
      - run: 'grep -q "candidate: meshfit" /tmp/meshfit-benchmark-preflight.yaml'
      - run: '! cargo run -p meshfit -- benchmark-preflight /tmp/meshfit-benchmark-001-materialized meshfit --host node-b --require-ready'
      - run: '! cargo run -p meshfit -- benchmark-status /tmp/meshfit-benchmark-001-materialized --require-complete'
      - run: '! cargo run -p meshfit -- benchmark-finalize /tmp/meshfit-benchmark-001-materialized'
      - run: printf '[' > /tmp/meshfit-benchmark-001-materialized/results/meshfit/run-01.yaml
      - run: cargo run -p meshfit -- benchmark-status /tmp/meshfit-benchmark-001-materialized > /tmp/meshfit-benchmark-status-invalid.yaml
      - run: grep -q 'parse failed' /tmp/meshfit-benchmark-status-invalid.yaml
      - run: '! cargo run -p meshfit -- benchmark-kit /tmp/meshfit-snapshot-manifest.yaml examples/placement-target.yaml node-b:gpu0:vllm:SingleHost Qwen/Qwen3-32B /tmp/meshfit-model-identity.yaml --require-ready'
      - run: cargo run -p meshfit -- compare-benchmarks examples/benchmark-comparison.yaml --markdown > /tmp/meshfit-benchmark-comparison.md
      - run: '! cargo run -p meshfit -- compare-benchmarks examples/benchmark-comparison.yaml --require-publishable'
      - run: cargo run -p meshfit -- predict /tmp/meshfit-benchmark-evidence.yaml examples/benchmark-query.yaml
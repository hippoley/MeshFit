infrastructure:
  nodes:
    - id: local-4090
      site: foshan
      ram_gb: 512
      hourly_cost_usd: 0
      accelerators:
        - id: local-4090-0
          backend: cuda
          memory_gb: 24
          free_memory_gb: 23
          relative_compute: 5
        - id: local-4090-1
          backend: cuda
          memory_gb: 24
          free_memory_gb: 23
          relative_compute: 5

    - id: aws-h100
      site: tokyo
      ram_gb: 256
      hourly_cost_usd: 6.74
      accelerators:
        - id: aws-h100-0
          backend: cuda
          memory_gb: 80
          free_memory_gb: 78
          relative_compute: 10
        - id: aws-h100-1
          backend: cuda
          memory_gb: 80
          free_memory_gb: 78
          relative_compute: 10

    - id: office-mac
      site: shenzhen
      ram_gb: 128
      hourly_cost_usd: 0

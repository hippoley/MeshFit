    - from:
        scope: node
        node: local-4090
      to:
        scope: node
        node: office-mac
      kind: wan
      bandwidth_gbps: 1
      latency_ms: 6
      jitter_ms: 1
      egress_cost_usd_per_gb: 0

model:
  id: qwen-72b-class-q4
  parameters_b: 72
  weight_memory_gb: 42
  kv_cache_gb: 0
  kv_cache_model:
    mode: bytes_per_token
    bytes_per_token: 327680
  is_moe: false
  required_backends: []

runtimes:
  - id: vllm
    backends: [cuda]
    supports_tp: true
    supports_pp: true
    supports_ep: false
    supports_rpc: false
    supports_cpu_offload: false

  - id: llama.cpp
    backends: [cuda, metal, cpu]
    supports_tp: false
    supports_pp: false
    supports_ep: false
    supports_rpc: true
    supports_cpu_offload: true

workload:

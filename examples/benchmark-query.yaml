identity:
  hardware:
    architecture: x86_64
    operating_system: linux
    cpu_model: EPYC
    ram_mib: 65536
    devices:
      - vendor: nvidia
        model: H100
        backend: cuda
        memory_mib: 81920
        driver_version: "580.65"
  model:
    model_id: qwen-demo
    format: safetensors
    quantization: awq4
    artifact_sha256: demo-sha
    revision: main
  runtime:
    runtime: vllm
    version: demo
    build_commit: null
    flags:
      - --max-model-len
      - "4096"
      - --tensor-parallel-size
      - "1"
  topology:
    links: []
  placement: single_host
context_tokens: 4096
concurrency: 1
metric: decode_tokens_per_second
